<!-- YouTube Videos Section -->
<section class="youtube-section" *ngIf="videos.length">
  <h2>Videos</h2>

  <div class="video-grid">
    <div
      class="video-tile"
      *ngFor="let video of videos"
      role="button"
      tabindex="0"
      (click)="openVideo(video.videoId)"
      (keydown.enter)="openVideo(video.videoId)"
    >
      <img
        [src]="video.thumbnail"
        [alt]="video.title"
        loading="lazy"
      />
      <span class="play-icon">▶</span>
    </div>
  </div>
</section>

<!-- Gallery Section -->
<section class="section">
  <h2>Gallery</h2>

  <!-- Year Filter -->
  <div class="filter-bar">
    <label for="yearFilter">Filter by Year:</label>
    <select [(ngModel)]="selectedYear">
      <option value="all">All</option>
      <option *ngFor="let year of years" [value]="year">{{ year }}</option>
    </select>
  </div>

  <!-- Event Blocks -->
  <div *ngFor="let event of filteredEvents" class="event-block">
    <h3>{{ event.year }} - {{ event.name }}</h3>

    <div class="gallery">
      <div *ngFor="let file of event.files" class="tile" role="button" tabindex="0" (click)="openLightbox(file)" (keydown.enter)="openLightbox(file)">
        <img [src]="file" [alt]="event.name">
      </div>
    </div>
  </div>

  <!-- Lightbox Modal -->
<!-- Lightbox Modal -->
<!-- Lightbox Modal -->
<div class="lightbox" *ngIf="selectedImage || selectedVideo" (click)="closeLightbox()">
  <div class="lightbox-content" (click)="$event.stopPropagation()">
    <button class="close-btn" (click)="closeLightbox()">✖</button>

    <!-- Image -->
    <img
      *ngIf="selectedImage"
      [src]="selectedImage"
      alt="Preview"
    />

    <!-- YouTube Video -->
    <iframe
      *ngIf="selectedVideo"
      [src]="selectedVideo"
      frameborder="0"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>
</div>



</section>
